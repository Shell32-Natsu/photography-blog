name: Deploy admin

# Tests the admin Worker and deploys it to Cloudflare whenever admin/ changes
# on master. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account to deploy to

on:
  push:
    branches:
    - master
    paths:
    - admin/**
    - .github/workflows/admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-admin

jobs:
  deploy:
    name: test and deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
    - name: Check out git repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: admin/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check
      run: npm run check

    - name: Test
      run: npm test

    - name: Deploy
      run: npx wrangler deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
